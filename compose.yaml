services:
  database:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5544:5432"
    environment:
      POSTGRES_DB: pustaka
      POSTGRES_USER: pustaka
      POSTGRES_PASSWORD: pustaka_dev
    volumes:
      - pustaka_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pustaka -d pustaka"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pustaka_data:
